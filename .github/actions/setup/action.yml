name: Setup

runs:
  using: composite
  steps:
    - name: Install node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Cache
      uses: actions/cache@v6
      id: cache
      with:
        path: '**/node_modules'
        key: yarn-4-${{ hashFiles('**/yarn.lock') }}
    - name: Install
      run: yarn --immutable
      shell: bash
      if: steps.cache.outputs.cache-hit != 'true'
