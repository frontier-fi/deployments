name: 'Check Action IDs'
inputs:
  network-name:
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - name: Set up environment
      uses: ./.github/actions/setup
    - name: Check Action IDs
      run: yarn check-network-action-ids ${{ inputs.network-name }}
      shell: bash
